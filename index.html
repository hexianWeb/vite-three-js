  <body>
    <main class="flex h-full bg-primary text-color">
      <canvas id="canvas" class="z-[0] h-full w-full"></canvas>
      
      <!-- Control Buttons -->
      <div class="fixed top-4 right-4 z-20 flex gap-4">
        <!-- Day/Night Toggle Button -->
        <button id="dayNightToggle" class="w-12 h-12 bg-white/10 backdrop-blur-md rounded-lg border-2 border-white/20 hover:bg-white/20 transition-all duration-200 flex items-center justify-center">
          <img src="/assets/images/tsc-sunmoon.png" alt="Toggle Day/Night" class="w-8 h-8 pixel-art">
        </button>
        
        <!-- Menu Button -->
        <button id="menuButton" class="w-12 h-12 bg-white/10 backdrop-blur-md rounded-lg border-2 border-white/20 hover:bg-white/20 transition-all duration-200 flex items-center justify-center">
          <img src="/assets/images/menu.png" alt="Menu" class="w-8 h-8 pixel-art">
        </button>
      </div>

      <!-- Dialog Box -->
      <div class="fixed bottom-0 left-0 right-0 z-10 p-4">
        <div class="bg-slate-800/90 backdrop-blur-md rounded-lg border-2 border-white/20 w-5/6 h-[24vh] p-6 mx-auto mb-10">
          <!-- Character Portrait -->
          <div class="flex items-start gap-4">
            <div class="w-48 h-48 bg-slate-700 rounded-lg overflow-hidden">
              <img id="characterPortrait" src="/assets/images/hexianWeb.png" alt="Character" class="w-full h-full object-cover pixel-art">
            </div>
            <!-- Dialog Content -->
            <div class="flex-1">
              <h3 id="characterName" class="text-3xl font-pixelify text-white mb-2">HeXianWeb</h3>
              <div id="dialogText" class="text-white/90 font-pixelify leading-relaxed text-2xl">
                您好我是 HeXianWeb，一个专注于 Web3D 开发的工程师。
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Brand Dialog -->
      <div id="brandDialog" class="fixed inset-0 z-10 hidden">
        <!-- Backdrop overlay -->
        <div class="absolute inset-0 bg-black bg-opacity-50 backdrop-blur-sm"></div>
        
        <!-- Dialog content -->
        <div class="relative flex items-center justify-center min-h-screen p-4">
          <div class="bg-white rounded-lg shadow-xl max-w-md w-full p-6 relative">
            <button id="dialogClose" class="absolute top-3 right-3 text-gray-500 hover:text-gray-700 transition-colors">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
              </svg>
            </button>
            <h2 id="dialogTitle" class="text-xl font-bold mb-4 text-slate-950"></h2>
            <div id="dialogImage" class="w-full mb-4 rounded-lg overflow-hidden shadow-md">
              <!-- GIF image will be inserted here -->
            </div>
            <div id="dialogContent" class="text-gray-700 mb-6 leading-relaxed"></div>
            <a id="dialogUrl" href="#" target="_blank" class="inline-block px-5 py-2.5 bg-blue-500 text-white rounded-md hover:bg-blue-600 transition-colors shadow-sm font-medium">访问链接</a>
          </div>
        </div>
      </div>
